name: Verify portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portfolio
        run: npm run build

      - name: Check generated site
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/gallery-data.js
          test -f dist/cv-olga-alvarez.pdf
          test "$(find dist/media -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 6
